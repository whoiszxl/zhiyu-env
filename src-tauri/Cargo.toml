[package]
name = "zhiyu-env-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zhiyu_env_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 二进制名即 macOS 菜单栏 / Dock 中展示的应用名（开发模式未打包成 .app 时生效）
[[bin]]
name = "智屿Env"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64.workspace = true
bson.workspace = true
csv.workspace = true
devbox-core = { path = "../crates/devbox-core" }
dirs = "6"
feed-rs = "2.4"
hmac.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true
serde_norway.workspace = true
sha2.workspace = true
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "gzip", "brotli", "deflate", "socks"] }
rustls = "0.23"
webpki-roots = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
russh = { version = "0.62.4", default-features = false, features = ["ring"] }
portable-pty = "0.9"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time", "net", "rt-multi-thread"] }
toml.workspace = true
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[dev-dependencies]
tempfile = "3"
